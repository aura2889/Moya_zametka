<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заметка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Моя заметка</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#1d2b2b; --mute:#6b7773; --line:#e4dccb;
  --brand:#0f3d3e; --brand2:#17595a; --gold:#b8892f; --goldsoft:#f3e6c4; --chip:#ece4d1; --chipon:#0f3d3e; --chiponink:#f6e7bd;
  --shadow:0 1px 2px rgba(30,40,40,.06),0 6px 18px rgba(30,40,40,.06);
  --fs:17px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1718; --card:#132425; --ink:#ece6d6; --mute:#8fa09b; --line:#223a3b;
    --brand:#0a2a2b; --brand2:#17595a; --gold:#e0b860; --goldsoft:#2b2a1c; --chip:#1a3031; --chipon:#e0b860; --chiponink:#13211f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1718; --card:#132425; --ink:#ece6d6; --mute:#8fa09b; --line:#223a3b;
  --brand:#0a2a2b; --brand2:#17595a; --gold:#e0b860; --goldsoft:#2b2a1c; --chip:#1a3031; --chipon:#e0b860; --chiponink:#13211f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:840px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#f6e7bd;padding-top:env(safe-area-inset-top);box-shadow:0 2px 12px rgba(0,0,0,.25)}
header::after{content:"";display:block;height:6px;background:
  repeating-linear-gradient(135deg,var(--gold) 0 6px,transparent 6px 12px),
  repeating-linear-gradient(45deg,var(--gold) 0 6px,transparent 6px 12px);background-size:12px 6px;opacity:.55}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.25rem;letter-spacing:.3px;flex:1;white-space:nowrap}
.logo small{display:block;font:500 .68rem system-ui,sans-serif;opacity:.7;letter-spacing:.8px;text-transform:uppercase}
.ib{background:rgba(255,255,255,.1);border:0;border-radius:10px;width:38px;height:38px;color:#f6e7bd;font-size:1rem}
.ib:active{background:rgba(255,255,255,.22)}
.search{position:relative;padding-bottom:10px}
.search input{width:100%;border:0;border-radius:12px;padding:11px 38px 11px 40px;font:inherit;font-size:.95rem;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search input::placeholder{color:rgba(246,231,189,.65)}
.search input:focus{background:rgba(255,255,255,.2)}
.search .si{position:absolute;left:13px;top:11px;opacity:.7;pointer-events:none}
.search .cl{position:absolute;right:6px;top:3px;background:none;border:0;color:#f6e7bd;font-size:1.1rem;width:34px;height:34px;display:none}
.search.has .cl{display:block}

/* tabs */
.tabs{display:flex;gap:2px;padding-bottom:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding-left:12px!important;padding-right:12px!important;background:none;border:0;color:rgba(246,231,189,.7);padding:10px 4px 11px;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent;white-space:nowrap}
.tab .n{font-weight:500;font-size:.72rem;opacity:.7;margin-left:3px}
.tab.on{color:#fff;border-bottom-color:var(--gold)}

.subs{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;z-index:15}
.subs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.subs .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:550;white-space:nowrap;color:var(--ink)}
.chip .n{opacity:.6;font-weight:500;margin-left:4px;font-size:.78rem}
.chip.on{background:var(--chipon);color:var(--chiponink);box-shadow:var(--shadow)}

/* content */
main{padding:16px 0 90px}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 14px;color:var(--mute);font-size:.85rem}
.crumb b{font-family:Georgia,serif;font-size:1.15rem;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--gold),var(--brand2))}
.card h3{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:1.05em;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font:600 .62rem system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase;background:var(--goldsoft);color:var(--gold);padding:2px 7px;border-radius:6px}
.path{font-size:.74rem;color:var(--mute);margin:-2px 0 6px}
.txt{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin:0}
.txt.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--gold);font-weight:650;padding:6px 0 0;font-size:.88rem}
.act{display:flex;gap:4px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.act button{background:none;border:0;border-radius:9px;padding:6px 10px;color:var(--mute);font-size:.84rem;display:flex;gap:6px;align-items:center}
.act button:active{background:var(--chip)}
.act .fav.on{color:var(--gold);font-weight:650}
.act .sp{flex:1}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty .big{font-size:2.6rem}
mark{background:var(--goldsoft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--gold) inset}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--brand);color:#f6e7bd;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rand{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--gold);color:#1a1405;font-size:1.4rem;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.rand:active{transform:scale(.93)}

/* hero */
.hero{margin:16px 0 4px;border-radius:18px;padding:18px 18px 12px;color:#f6e7bd;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f3d3e,#17595a);box-shadow:var(--shadow)}
.hero::before{content:"“";position:absolute;right:12px;top:-26px;font:700 8rem Georgia,serif;color:rgba(224,184,96,.18);line-height:1}
.hero .lab{font:600 .68rem system-ui;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.hero .q{font-family:Georgia,"Times New Roman",serif;font-size:1.12em;line-height:1.5;font-style:italic;white-space:pre-wrap;margin:0;position:relative}
.hero .src{margin-top:10px;font-size:.8rem;opacity:.75}
.hero .hb{display:flex;gap:4px;margin-top:6px}
.hero .hb button{background:rgba(255,255,255,.12);border:0;border-radius:9px;padding:6px 11px;color:#f6e7bd;font-size:.82rem}
.hero .hb button:active{background:rgba(255,255,255,.25)}
/* lock */
.lock{text-align:center;padding:34px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-top:10px}
.lock .big{font-size:3rem}
.lock h2{font-family:Georgia,serif;margin:6px 0 4px}
.lock p{color:var(--mute);font-size:.88rem;margin:0 0 14px}
.lock input[type=password],.lock input[type=text]{width:100%;max-width:300px;text-align:center;font:inherit;font-size:1.05rem;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;letter-spacing:1px}
.lock input:focus{border-color:var(--gold)}
.lock .go{display:block;margin:12px auto 0;background:var(--brand);color:#f6e7bd;border:0;border-radius:12px;padding:11px 28px;font-weight:650}
.lock label{display:block;margin-top:12px;font-size:.84rem;color:var(--mute)}
.lock .err{color:#c0392b;font-size:.85rem;min-height:1.2em;margin-top:8px}
.relock{background:none;border:1px solid var(--line);border-radius:9px;color:var(--mute);padding:3px 10px;font-size:.78rem;margin-left:auto}
.note{background:var(--goldsoft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.88rem;white-space:pre-wrap}
.note b{display:block;margin-bottom:4px;color:var(--gold)}
/* goals */
.goal{display:flex;gap:12px;align-items:flex-start}
.goal .ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--gold);background:none;color:transparent;font-size:1rem;line-height:1;margin-top:2px}
.goal.done .ck{background:var(--gold);color:#1a1405}
.goal.done .gt{text-decoration:line-through;opacity:.6}
.goal .gt{font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:.76rem;background:var(--chip);border-radius:8px;padding:2px 8px;color:var(--ink)}
.pill.gold{background:var(--goldsoft);color:var(--gold);font-weight:650}
.pill.red{color:#b5473a}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--brand2))}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--gold)}
.ev .dt{font:700 .74rem system-ui;color:var(--gold);letter-spacing:.5px}
.ev .card{margin:4px 0 0;padding:12px 14px}
.ev h3{margin:0 0 4px!important}
.ev .goto{background:none;border:0;color:var(--gold);padding:4px 0 0;font-size:.82rem;font-weight:650}

@media (min-width:700px){
  .subs .wrap{flex-wrap:wrap;overflow:visible}
  .tabs{justify-content:flex-start}
  .tab{font-size:1rem}
}
/* home */
.cover{margin:16px 0 14px;border-radius:22px;padding:26px 22px 22px;color:#f6e7bd;position:relative;overflow:hidden;
  background:
   radial-gradient(circle at 85% 12%,rgba(224,184,96,.28),transparent 45%),
   linear-gradient(140deg,#0b3031,#17595a 70%,#1d6b61);box-shadow:var(--shadow)}
.cover::before{content:"";position:absolute;inset:0;opacity:.09;
  background:repeating-linear-gradient(45deg,#e0b860 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,#e0b860 0 2px,transparent 2px 22px)}
.cover>*{position:relative}
.cover .hi{font:600 .78rem system-ui;letter-spacing:1.2px;text-transform:uppercase;opacity:.8}
.cover h1{font-family:Georgia,"Times New Roman",serif;font-size:2.1rem;margin:6px 0 2px;line-height:1.15}
.cover .sub{opacity:.8;font-size:.95rem}
.cover .date{margin-top:14px;font-size:.82rem;opacity:.7}
.today{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px 14px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.today::before{content:"“";position:absolute;right:14px;top:-30px;font:700 8rem Georgia,serif;color:var(--gold);opacity:.18;line-height:1}
.today .lab{display:flex;gap:8px;align-items:center;font:700 .7rem system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.today .lab .k{background:var(--goldsoft);padding:2px 8px;border-radius:6px}
.today.mine{border-left:4px solid var(--gold)}
.today .q{font-family:Georgia,"Times New Roman",serif;font-size:1.35em;line-height:1.5;font-style:italic;white-space:pre-wrap;margin:12px 0 8px;position:relative}
.today .src{font-size:.82rem;color:var(--mute)}
.today .hb{display:flex;gap:6px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.today .hb button{background:none;border:0;border-radius:9px;padding:6px 10px;color:var(--mute);font-size:.86rem}
.today .hb button:active{background:var(--chip)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--brand2))}
.tile .ic{font-size:1.9rem}
.tile .tt{font-family:Georgia,serif;font-weight:700;font-size:1.1rem;margin-top:6px}
.tile .tc{font-size:.8rem;color:var(--mute);margin-top:2px;line-height:1.35}
.tile:active{transform:scale(.98)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">Моя заметка<small>Тілектер · Даналық · Өмір</small></div>
      <button class="ib" id="fminus" title="Меньше" aria-label="Меньше">A−</button>
      <button class="ib" id="fplus" title="Больше" aria-label="Больше">A+</button>
      <button class="ib" id="theme" title="Тема" aria-label="Тема">◐</button>
    </div>
    <div class="search" id="sbox">
      <span class="si">🔍</span>
      <input id="q" type="search" placeholder="Поиск по всем заметкам…" autocomplete="off">
      <button class="cl" id="qc" aria-label="Очистить">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<div class="subs" id="subs"><div class="wrap" id="subsin"></div></div>
<div class="wrap" id="hero"></div>
<main class="wrap" id="main"></main>
<button class="rand" id="rand" title="Случайная заметка" aria-label="Случайная">🎲</button>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="private.enc.js"></script>
<script>
(function(){
'use strict';
var D = window.DATA || [];
var $ = function(id){return document.getElementById(id)};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* приватный раздел (зашифрован в private.enc.js) */
var LIFE=D.filter(function(s){return s.id==='life'})[0];
var SECRET=null;

function assignKeys(s){s.subs.forEach(function(b){b.items.forEach(function(it,i){it._k=s.id+'/'+b.id+'/'+i;it._s=s;it._b=b})})}
D.forEach(assignKeys);
var FAV = lsGet('zm_fav',{});
var GOALS = lsGet('zm_goals_unused',{});
var st = lsGet('zm_state',{tab:'home',sub:{}}); st.tab='home';
var fs = lsGet('zm_fs',17), query='';

function favCount(){return Object.keys(FAV).filter(function(k){return FAV[k]}).length}
function allItems(withPriv){var r=[];D.forEach(function(s){s.subs.forEach(function(b){if(b.kind!=='goals')r=r.concat(b.items)})});if(withPriv&&SECRET)r.push(SECRET);return r}
function save(){lsSet('zm_state',st)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1600)}
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hl(text,q){
  var h=esc(text); if(!q) return h;
  var qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{return h.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>')}catch(e){return h}
}
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDate(d){var p=d.split('-');return (p[2]?+p[2]+' ':'')+MON[+p[1]-1]+' '+p[0]}
function fmtNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function countdown(d){
  var t=new Date(d+'T00:00:00'), n=new Date(), days=Math.round((t-n)/864e5), ab=Math.abs(days);
  var y=Math.floor(ab/365), m=Math.floor((ab%365)/30), parts=[];
  if(y)parts.push(y+' '+(y===1?'год':y<5?'года':'лет')); if(m)parts.push(m+' мес.'); if(!parts.length)parts.push(ab+' дн.');
  return days>=0?{txt:'осталось '+parts.join(' '),late:false}:{txt:'срок прошёл '+parts.join(' ')+' назад',late:true};
}

/* ---------- расшифровка ---------- */
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function decryptWith(key){
  var P=window.PRIVATE; if(!P||!window.crypto||!crypto.subtle) return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},key,b2u(P.ct)).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}
function applyLife(data){
  var d=LIFE.subs.filter(function(b){return b.id==='diary'})[0];
  SECRET=data.items[0];SECRET._k='life/diary/secret';SECRET._s=LIFE;SECRET._b=d;SECRET._priv=true;
}
function unlockWithPass(pass,remember){
  var P=window.PRIVATE;
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])
  }).then(function(key){
    return decryptWith(key).then(function(data){
      applyLife(data);
      if(remember) crypto.subtle.exportKey('raw',key).then(function(raw){lsSet('zm_pk',u2b(new Uint8Array(raw)))});
    });
  });
}
function autoUnlock(){
  var k=lsGet('zm_pk',null); if(!k||!window.PRIVATE||!window.crypto||!crypto.subtle) return Promise.resolve();
  return crypto.subtle.importKey('raw',b2u(k),'AES-GCM',false,['decrypt']).then(decryptWith).then(applyLife).catch(function(){lsDel('zm_pk')});
}
function relock(){lsDel('zm_pk');SECRET=null;render();toast('Скрыто 🔒')}

/* ---------- вкладки ---------- */
function renderTabs(){
  var h='<button class="tab'+(st.tab==='home'&&!query?' on':'')+'" data-t="home">🏠 Басты</button>';
  D.forEach(function(s){
    var n=s.priv&&s.locked?'🔒':s.subs.reduce(function(a,b){return a+b.items.length},0);
    h+='<button class="tab'+(st.tab===s.id&&!query?' on':'')+'" data-t="'+s.id+'">'+s.icon+' '+esc(s.title)+'<span class="n">'+n+'</span></button>';
  });
  h+='<button class="tab'+(st.tab==='fav'&&!query?' on':'')+'" data-t="fav">⭐ Таңдаулы<span class="n">'+favCount()+'</span></button>';
  $('tabs').innerHTML=h;
  var on=$('tabs').querySelector('.tab.on'); if(on) $('tabs').scrollLeft=on.offsetLeft-20;
}
function curSection(){return D.filter(function(s){return s.id===st.tab})[0]}
function curSub(s){var id=st.sub[s.id];return s.subs.filter(function(b){return b.id===id})[0]||s.subs[0]}

function renderSubs(){
  var box=$('subsin'), wrap=$('subs'), s=curSection();
  if(query||!s||(s.priv&&s.locked)){wrap.style.display='none';return}
  wrap.style.display='';
  var cur=curSub(s), h='';
  s.subs.forEach(function(b){
    h+='<button class="chip'+(b===cur?' on':'')+'" data-s="'+b.id+'">'+b.icon+' '+esc(b.title)+(b.kind==='timeline'?'':'<span class="n">'+b.items.length+'</span>')+'</button>';
  });
  box.innerHTML=h;
  var on=box.querySelector('.chip.on'); if(on) box.scrollLeft=on.offsetLeft-16;
}
function stickSubs(){ $('subs').style.top=(document.querySelector('header').offsetHeight-1)+'px' }

/* ---------- карточки ---------- */
function cardHTML(it,showPath,q){
  var priv=!!it._priv;
  var long=it.t.length>420||it.t.split('\n').length>9;
  var h='<article class="card" data-k="'+it._k+'">';
  h+='<h3>'+hl(it.w,q)+(it.l?'<span class="tag">'+esc(it.l)+'</span>':'')+'</h3>';
  if(showPath) h+='<div class="path">'+it._s.icon+' '+esc(it._s.title)+' › '+it._b.icon+' '+esc(it._b.title)+'</div>';
  h+='<p class="txt'+(long&&!q?' clamp':'')+'">'+hl(it.t,q)+'</p>';
  if(long&&!q) h+='<button class="more" data-a="more">Толығырақ ▾</button>';
  h+='<div class="act"><button data-a="copy">📋 Көшіру</button><button data-a="share">↗ Бөлісу</button><span class="sp"></span>';
  if(priv) h+='<button data-a="relock">🔒 Скрыть</button>';
  if(!priv) h+='<button class="fav'+(FAV[it._k]?' on':'')+'" data-a="fav">'+(FAV[it._k]?'★ Таңдаулы':'☆ Таңдау')+'</button>';
  return h+'</div></article>';
}
function goalHTML(it){
  var h='<article class="card" data-k="'+it._k+'"><div class="gt" style="font-weight:600">'+esc(it.g)+'</div><div class="pills">';
  if(it.a) h+='<span class="pill gold">'+fmtNum(it.a)+' ₸</span>';
  if(it.d) h+='<span class="pill">📅 к '+it.d.slice(0,4)+' году</span>';
  return h+'</div></article>';
}
function timelineHTML(items){
  var arr=items.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}), h='<div class="tl">';
  arr.forEach(function(it){
    var go=it.go?'<button class="goto" data-go="'+it.go+'">→ открыть запись</button>':'';
    h+='<div class="ev"><div class="dt">'+fmtDate(it.d).toUpperCase()+'</div><div class="card"><h3>'+esc(it.w)+'</h3><p class="txt">'+esc(it.t)+'</p>'+go+'</div></div>';
  });
  return h+'</div>';
}
function byKey(k){return allItems(true).filter(function(i){return i._k===k})[0]}

function lockHTML(){
  var ok=window.PRIVATE&&window.crypto&&crypto.subtle;
  return '<div class="lock" style="margin:0 0 12px;padding:20px 16px"><div class="big" style="font-size:2rem">🔒</div><h2 style="font-size:1.05rem">Вахтадан кейін · 10.08.2026</h2><p>Эта запись зашифрована. Введите код, чтобы открыть.</p>'+
  (ok?'<input id="pw" type="password" inputmode="numeric" placeholder="код" autocomplete="off" spellcheck="false"><label><input type="checkbox" id="rem" checked> запомнить на этом устройстве</label><button class="go" id="unl">Открыть</button><div class="err" id="err"></div>':'<div class="err">Нужен https-адрес и современный браузер</div>')+'</div>';
}
function tryUnlock(){
  var pw=$('pw').value.trim(); if(!pw)return;
  $('err').textContent='Проверяю…';
  unlockWithPass(pw,$('rem').checked).then(function(){render()}).catch(function(){$('err').textContent='Неверный код';$('pw').select()});
}

function renderMain(){
  var m=$('main'), h='';
  if(query){
    var q=query.toLowerCase();
    var r=allItems(true).filter(function(i){return ((i.w||i.g||'')+' '+(i.t||'')).toLowerCase().indexOf(q)>-1&&i.w});
    h+='<div class="crumb"><b>Іздеу</b> · '+r.length+' найдено</div>';
    if(!r.length) h+='<div class="empty"><div class="big">🔎</div>Ничего не найдено</div>';
    r.slice(0,80).forEach(function(i){h+=cardHTML(i,true,query)});
    if(r.length>80) h+='<div class="empty">Показаны первые 80 — уточните запрос</div>';
  }else if(st.tab==='home'){
    h=homeHTML();
  }else if(st.tab==='fav'){
    var f=allItems(false).filter(function(i){return FAV[i._k]});
    h+='<div class="crumb"><b>⭐ Таңдаулы</b> · '+f.length+'</div>';
    if(!f.length) h+='<div class="empty"><div class="big">☆</div>Пока пусто.<br>Нажмите «☆ Таңдау» на любой заметке</div>';
    f.forEach(function(i){h+=cardHTML(i,true)});
  }else{
    var s=curSection(); if(!s){m.innerHTML='';return}
    if(s.priv&&s.locked){m.innerHTML=lockHTML();return}
    var b=curSub(s);
    h+='<div class="crumb"><b>'+b.icon+' '+esc(b.title)+'</b>'+(b.kind==='timeline'?'':' · '+b.items.length)+''+'</div>';
    if(b.note) h+='<div class="note">'+(b.kind==='timeline'?'<b>🧭 Путь</b>':'')+esc(b.note.replace(/^Взгляд со стороны \(Claude\), по твоим записям\.\n\n/,''))+'</div>';
    if(b.kind==='goals') b.items.forEach(function(i){h+=goalHTML(i)});
    else if(b.kind==='timeline') h+=timelineHTML(b.items);
    else{ if(b.id==='diary') h+=(SECRET?cardHTML(SECRET,false):lockHTML()); b.items.forEach(function(i){h+=cardHTML(i,false)}) }
  }
  m.innerHTML=h;
}

/* ---------- главная ---------- */
var heroItem=null, mineItem=null;
function pickFrom(src,key){
  var recent=lsGet(key,[]), cand=src.filter(function(x){return recent.indexOf(x.t)<0});
  if(!cand.length){cand=src;recent=[]}
  var it=cand[Math.floor(Math.random()*cand.length)];
  recent.push(it.t); if(recent.length>40) recent=recent.slice(-40); lsSet(key,recent);
  return it;
}
function pickHero(){ var ex=window.EXTRA||[]; if(ex.length) heroItem=pickFrom(ex,'zm_recent') }
function pickMine(){
  var pool=[];
  D.forEach(function(s){ if(s.id==='tilek')return;
    (s.quotes||[]).forEach(function(q){pool.push({t:q.t,s:q.s,k:'Өмір'})});
    if(s.id==='life')return;
    s.subs.forEach(function(b){ if(b.id==='azil'||b.id==='messi')return;
      b.items.forEach(function(it){ if(it.t.length<=300&&it.t.length>=40) pool.push({t:it.t,s:'Даналық · '+it.w,k:'Даналық'}) }) }) });
  if(pool.length) mineItem=pickFrom(pool,'zm_recent_mine');
}
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function homeHTML(){
  var d=new Date(), hr=d.getHours();
  var hi=hr<5?'Түнгі сағат':hr<12?'Қайырлы таң':hr<18?'Қайырлы күн':'Қайырлы кеш';
  var h='<section class="cover"><div class="hi">'+hi+'</div><h1>Моя заметка</h1><div class="sub">Тілектер · Даналық · Өмір</div><div class="date">'+WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+'</div></section>';
  if(heroItem) h+='<section class="today"><div class="lab">✦ Мысль дня <span class="k">'+esc(heroItem.k||'')+'</span></div><p class="q">'+esc(heroItem.t)+'</p><div class="src">— '+esc(heroItem.s)+'</div><div class="hb"><button data-h="again">↻ Ещё</button><button data-h="copy">📋 Көшіру</button></div></section>';
  if(mineItem) h+='<section class="today mine"><div class="lab">📖 Из моих записей <span class="k">'+esc(mineItem.k||'')+'</span></div><p class="q">'+esc(mineItem.t)+'</p><div class="src">— '+esc(mineItem.s)+'</div><div class="hb"><button data-h="again2">↻ Ещё</button><button data-h="copy2">📋 Көшіру</button></div></section>';
  h+='<div class="tiles">';
  D.forEach(function(s){
    var n=s.priv&&s.locked?'🔒 закрыто':s.subs.reduce(function(a,b){return a+b.items.length},0)+' записей';
    var d2=s.priv?'Цели, хронология, дневник':s.subs.slice(0,3).map(function(b){return b.title.split(' · ')[0]}).join(', ')+'…';
    h+='<button class="tile" data-tile="'+s.id+'"><div class="ic">'+s.icon+'</div><div class="tt">'+esc(s.title)+'</div><div class="tc">'+n+'<br>'+esc(d2)+'</div></button>';
  });
  h+='<button class="tile" data-tile="fav"><div class="ic">⭐</div><div class="tt">Таңдаулы</div><div class="tc">'+favCount()+' в избранном<br>ваши отметки</div></button>';
  return h+'</div>';
}
function renderHero(){$('hero').innerHTML=''}
function render(){renderTabs();renderSubs();renderMain();renderHero();stickSubs()}

/* ---------- события ---------- */
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return;
  query='';$('q').value='';$('sbox').classList.remove('has');
  st.tab=b.dataset.t;save();render();window.scrollTo(0,0);
});
$('subsin').addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b)return;
  st.sub[st.tab]=b.dataset.s;save();render();window.scrollTo(0,0);
});
$('q').addEventListener('input',function(){
  query=this.value.trim();$('sbox').classList.toggle('has',!!this.value);render();
});
$('qc').addEventListener('click',function(){$('q').value='';query='';$('sbox').classList.remove('has');render()});
function copyText(txt){
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Скопировано ✓')}catch(x){toast('Не удалось')}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Скопировано ✓')},fallback)}else fallback();
}
$('main').addEventListener('click',function(e){
  var t=e.target;
  var hb=t.closest('button[data-h]');
  if(hb){ var hv=hb.dataset.h;
    if(hv==='again'){pickHero();renderMain()} else if(hv==='again2'){pickMine();renderMain()}
    else if(hv==='copy2') copyText(mineItem.t+'\n— '+mineItem.s); else copyText(heroItem.t+'\n— '+heroItem.s); return }
  var tl=t.closest('button[data-tile]');
  if(tl){st.tab=tl.dataset.tile;save();render();window.scrollTo(0,0);return}
  if(t.id==='unl'){tryUnlock();return}
  if(t.id==='relock'){relock();return}
  var go=t.closest('button[data-go]');
  if(go){st.sub.life=go.dataset.go;save();render();window.scrollTo(0,0);return}
  var b=t.closest('button[data-a]'); if(!b)return;
  var card=b.closest('.card'), it=byKey(card.dataset.k), a=b.dataset.a;
  if(a==='relock'){relock();return}
  if(a==='more'){var p=card.querySelector('.txt');var c=p.classList.toggle('clamp');b.textContent=c?'Толығырақ ▾':'Жасыру ▴'}
  else if(a==='copy'){copyText(it.w+'\n\n'+it.t)}
  else if(a==='share'){
    if(navigator.share){navigator.share({title:it.w,text:it.t}).catch(function(){})}else copyText(it.t);
  }
  else if(a==='fav'){
    if(FAV[it._k]) delete FAV[it._k]; else FAV[it._k]=true;
    lsSet('zm_fav',FAV);
    if(st.tab==='fav'&&!query){render()} else {
      b.classList.toggle('on',!!FAV[it._k]);b.textContent=FAV[it._k]?'★ Таңдаулы':'☆ Таңдау';renderTabs();
    }
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pw')tryUnlock()});
$('fplus').addEventListener('click',function(){fs=Math.min(26,fs+1);lsSet('zm_fs',fs);applyFs()});
$('fminus').addEventListener('click',function(){fs=Math.max(13,fs-1);lsSet('zm_fs',fs);applyFs()});
$('theme').addEventListener('click',function(){
  var r=document.documentElement, cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  var n=dark?'light':'dark'; r.setAttribute('data-theme',n); lsSet('zm_theme',n);
});
$('rand').addEventListener('click',function(){
  var all=allItems(false); if(!all.length)return;
  var it=all[Math.floor(Math.random()*all.length)];
  query='';$('q').value='';$('sbox').classList.remove('has');
  st.tab=it._s.id;st.sub[it._s.id]=it._b.id;save();render();
  var el=document.querySelector('[data-k="'+it._k+'"]');
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--gold)';setTimeout(function(){el.style.outline=''},1800)}
});
window.addEventListener('resize',stickSubs);
['tabs','subsin'].forEach(function(id){var el=$(id);el.addEventListener('wheel',function(e){if(el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})});

var th=lsGet('zm_theme',null); if(th)document.documentElement.setAttribute('data-theme',th);

applyFs();pickHero();pickMine();render();
autoUnlock().then(function(){render()});
setTimeout(stickSubs,50);

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
